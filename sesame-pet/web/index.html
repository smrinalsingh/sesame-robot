<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111114">
  <title>Sesame</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <main class="phone">
    <header>
      <span class="dot" id="link"></span>
      <h1>Sesame</h1>
      <span class="muted" id="mode"></span>
      <span class="spacer"></span>
      <button id="sound" title="Pet sounds on this phone" aria-label="Toggle sounds">🔊</button>
      <button id="toggle3d" title="Show or hide the 3D view" aria-label="Toggle 3D view">3D</button>
    </header>
    <div class="banner" id="banner" hidden></div>
    <div class="view" id="view"><canvas class="oled" id="oled" width="128" height="64"></canvas></div>
    <section class="caption">
      <div class="heard" id="heard"><span class="muted">Tap the button and talk to Sesame.</span></div>
      <div class="said" id="said" hidden></div>
      <div class="acts" id="acts"></div>
    </section>
    <section class="callbar">
      <button class="call" id="call" aria-label="Call Sesame">
        <span class="ring" id="ring"></span>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <div class="call-label" id="callLabel">Call</div>
      <div class="seg" id="voiceMode" role="group" aria-label="How Sesame answers">
        <button data-mode="noises" title="Pet noises; its words show as a caption">🐾 Noises</button><button data-mode="words" title="Sesame speaks its words">💬 Words</button>
      </div>
    </section>
    <nav class="quick" id="quick"></nav>
  </main>
  <script type="module" src="/js/phone.js"></script>
</body>
</html>
